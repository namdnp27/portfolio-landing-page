<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container" id="container">
        <div class="form-container">
            <div class="form-icon">
                <i class="fa-solid fa-user-lock fa-2xl"></i>
            </div>
            <div class="info-form">
                <h2 class="header">Create an account</h2>
                <p class="sub-header">Enter your details to join Us</p>
                <form action="" class="form">
                    <label for="signup-username">Full Name</label>
                    <input type="text" id="signup-username" name="signup-username">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="signup-email">
                    <label for="password">Password</label>
                    <input type="password" id="signup-password" name="signup-password">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password">
                    <span id="error-msg"></span>
                    <button id="signUp">Create Account</button>

                </form>
            </div>
            <div class="line-text">
                <p> OR CONTINUE WITH </p>
            </div>
            <div class="signin-options">
                <button><i class="fa-brands fa-google"></i>Google</button>
                <button><i class="fa-brands fa-github"></i>Github</button>
            </div>
            <p class="signup-link">Already have an account? <a href="signin.html">Sign In</a></p>
        </div>
    </div>
</body>


<script src="signup.js"></script>
</body>

</html>
